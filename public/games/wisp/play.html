<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WISP — Development preview</title>
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <header><a href="/games/" target="_top">← Games</a><h1>WISP</h1><p>Development preview · Phase 1</p></header>
  <main>
    <section aria-label="Maze preview" class="arena">
      <div class="toolbar"><button id="new">New maze</button><button id="rotate">Rotate</button><button id="tutorial" aria-pressed="false">Tutorial maze</button><span id="seed"></span></div>
      <canvas id="board" aria-label="Maze and eight characters"></canvas>
      <div id="controls" aria-label="Movement controls"><button data-d="0,-1" aria-label="Up">↑</button><button data-d="-1,0" aria-label="Left">←</button><button data-d="0,1" aria-label="Down">↓</button><button data-d="1,0" aria-label="Right">→</button></div>
      <p class="hint">Arrow keys / WASD or buttons. Click a cell to preview a location ping.</p>
    </section>
    <section aria-label="Character gallery" class="gallery">
      <h2>Wisps</h2><div id="wisps" class="roster"></div>
      <h2>Hunters</h2><div id="hunters" class="roster"></div>
      <p class="hint">Select a character to inspect it at gameplay scale. Abilities are not active yet.</p>
    </section>
  </main>
  <script type="module" src="./preview.mjs"></script>
</body>
</html>
