<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081c23">
<title>WISP · Forest Survival</title>
<style>
  :root { color-scheme:dark; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#ecf7ef; background:#081b22 }
  * { box-sizing:border-box }
  body { margin:0; min-height:100dvh; background:radial-gradient(circle at 45% -20%,#153b3a,#081b22 65%); line-height:1.4; padding-bottom:24px }
  .wrap { max-width:1200px; margin:auto; padding:clamp(10px,2.1vw,24px) }
  .game-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:2px 0 12px }
  .game-header h1 { margin:0; font-size:24px; letter-spacing:.16em }
  .game-header p { margin:0 88px 0 0; font-size:11px; letter-spacing:.13em; color:#a4c8b5; text-transform:uppercase }
  .game-frame { position:relative; width:100%; background:#0a252b; overflow:hidden; border:1px solid #31594d; box-shadow:0 20px 55px #03101480 }
  canvas { width:100%; height:auto; aspect-ratio:2 / 1; display:block; touch-action:none }
  #wildfire-layer,#cutter-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none }
  #wildfire-layer { z-index:1 }
  #cutter-layer { z-index:2 }
  #wildfire-svg { position:absolute; display:none; max-width:none; max-height:none; pointer-events:none; overflow:visible; will-change:left,top }
  #cutter-svg { position:absolute; display:none; pointer-events:none; overflow:visible; will-change:left,top,transform; filter:drop-shadow(0 3px 2px #0006) }
  .run-dashboard { display:grid; grid-template-columns:minmax(150px,1.15fr) minmax(90px,.65fr) minmax(200px,1.35fr); gap:9px; margin:11px 0 0 }
  .run-panel { min-width:0; padding:10px 12px; border:1px solid #35574d; background:#112b2d; clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px)) }
  .run-label { display:block; font-size:10px; color:#99b7aa; letter-spacing:.1em; text-transform:uppercase }
  .run-value { display:block; font-size:17px; font-variant-numeric:tabular-nums; font-weight:750; color:#f0f8e9 }
  .run-value.small { font-size:12px; color:#f4c99f }
  .run-metric-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px }
  .meter,.threat-track { height:8px; background:#2c4840; overflow:hidden; margin-top:5px }
  #energyFill { width:100%; height:100%; background:#9bd477; transition:width .08s linear }
  #chaseThreat { width:0%; height:100%; background:linear-gradient(90deg,#e9ad53,#e26947); transition:width .1s linear }
  .game-actions { display:flex; align-items:stretch; gap:8px; margin-top:10px }
  button { font:inherit; touch-action:manipulation; cursor:pointer; border:1px solid #709b75; background:#234c3c; color:#eef7e8; padding:12px 17px; font-size:14px; font-weight:700 }
  button:active,button.down { transform:translateY(1px); background:#3b6c50 }
  button:focus-visible { outline:2px solid #dcf5bc; outline-offset:3px }
  #jump { flex:1; min-height:64px; background:#a6d585; border-color:#dcffb9; color:#112d24; letter-spacing:.08em; user-select:none; -webkit-tap-highlight-color:transparent }
  #restart { min-height:64px; background:#3c5643; color:#f6f9ed }
  [hidden] { display:none!important }
  @media(max-width:720px) {
    body { padding-bottom:calc(88px + env(safe-area-inset-bottom)) }
    .wrap { padding:10px }
    .game-header h1 { font-size:20px }
    .game-header p { display:none }
    .run-dashboard { grid-template-columns:1fr 1fr; gap:5px; margin-top:7px }
    .run-panel { padding:8px 10px }
    .run-panel.threat { grid-column:1 / -1; }
    .run-value { font-size:15px }
    .game-actions { position:fixed; z-index:50; bottom:0; left:0; right:0; padding:8px 10px max(10px,env(safe-area-inset-bottom)); margin:0; background:#092027f2; border-top:1px solid #365b4b; }
    #jump,#restart { min-height:62px; font-size:14px }
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
