<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">WISP Forest Essence Orb</title>
  <desc id="desc">A small low-poly green forest energy orb with a soft glow and floating spark motes.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9ffb7" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#9be88d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#55c788" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="orb-root">
    <circle cx="128" cy="128" r="84" fill="url(#bgGlow)">
      <animate attributeName="r" values="82;86;82" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <g id="motes" fill="#eaffd0" opacity="0.95">
      <circle cx="61" cy="76" r="4">
        <animate attributeName="cy" values="76;70;76" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="194" cy="66" r="3.5">
        <animate attributeName="cy" values="66;60;66" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="211" cy="115" r="2.5">
        <animate attributeName="cy" values="115;110;115" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="54" cy="151" r="3">
        <animate attributeName="cy" values="151;145;151" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="177" cy="190" r="2.8">
        <animate attributeName="cy" values="190;183;190" dur="3.0s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g id="orb" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <polygon points="128,40 159,60 178,87 179,126 160,164 128,191 96,164 77,126 78,87 97,60" fill="#8be08b"/>
      <polygon points="128,40 159,60 128,71 97,60" fill="#efffcf"/>
      <polygon points="159,60 178,87 152,99 128,71" fill="#c4f5a4"/>
      <polygon points="178,87 179,126 149,132 152,99" fill="#9de396"/>
      <polygon points="179,126 160,164 137,156 149,132" fill="#82d48f"/>
      <polygon points="160,164 128,191 128,159 137,156" fill="#90df98"/>
      <polygon points="128,191 96,164 119,156 128,159" fill="#62c98b"/>
      <polygon points="96,164 77,126 107,132 119,156" fill="#4dbb84"/>
      <polygon points="77,126 78,87 104,99 107,132" fill="#67c98e"/>
      <polygon points="78,87 97,60 128,71 104,99" fill="#7cd78d"/>

      <polygon points="128,70 151,99 148,134 128,161 108,134 105,99" fill="#bff5aa" opacity="0.95"/>
      <polygon points="128,70 151,99 128,108 105,99" fill="#fcffec"/>
      <polygon points="151,99 148,134 128,140 128,108" fill="#d8fdbd"/>
      <polygon points="148,134 128,161 128,140" fill="#bbeaa1"/>
      <polygon points="128,161 108,134 128,140" fill="#98dd95"/>
      <polygon points="108,134 105,99 128,108 128,140" fill="#87d28f"/>

      <polygon points="128,86 138,103 128,126 118,103" fill="#fffef5" opacity="0.92"/>
      <polygon points="128,126 140,146 128,165 116,146" fill="#eaffd6" opacity="0.72"/>
    </g>
  </g>
</svg>
