name: UNFOLD browser UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/pages/games/unfold/**'
      - 'public/games/unfold/**'
      - 'tests/browser/**'
      - 'scripts/fix-html-routes.mjs'
      - 'package*.json'
      - 'Makefile'
      - '.github/workflows/unfold-ui.yml'
  pull_request:
    paths:
      - 'src/pages/games/unfold/**'
      - 'public/games/unfold/**'
      - 'tests/browser/**'
      - 'scripts/fix-html-routes.mjs'
      - 'package*.json'
      - 'Makefile'
      - '.github/workflows/unfold-ui.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/browser/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build site and run real-browser UI checks
        run: make check-ui
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unfold-ui-screenshots
          path: tests/browser/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
