name: WISP multiplayer backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/games/wisp/**'
      - 'public/games/wisp/**'
      - 'src/pages/games/wisp/**'
      - 'multiplayer/**'
      - '.github/workflows/wisp-worker.yml'
  pull_request:
    paths:
      - 'src/games/wisp/**'
      - 'public/games/wisp/**'
      - 'src/pages/games/wisp/**'
      - 'multiplayer/**'
      - '.github/workflows/wisp-worker.yml'

permissions:
  contents: read

concurrency:
  group: wisp-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multiplayer/package-lock.json
      - run: npm ci
        working-directory: multiplayer
      - run: npm run check:wisp
        working-directory: multiplayer

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-wisp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multiplayer/package-lock.json
      - name: Check Cloudflare deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'WISP requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in cloudflare-wisp or repository secrets.' >&2
            exit 1
          fi
      - run: npm ci
        working-directory: multiplayer
      - run: npm run deploy:wisp
        working-directory: multiplayer
