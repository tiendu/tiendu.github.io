name: UNFOLD multiplayer backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'multiplayer/src/unfold-worker.mjs'
      - 'multiplayer/wrangler.unfold.jsonc'
      - 'multiplayer/package*.json'
      - 'multiplayer/test/unfold*.test.mjs'
      - 'server/unfold/**'
      - 'public/games/unfold/engine.mjs'
      - '.github/workflows/unfold-worker.yml'
  pull_request:
    paths:
      - 'multiplayer/src/unfold-worker.mjs'
      - 'multiplayer/wrangler.unfold.jsonc'
      - 'multiplayer/package*.json'
      - 'multiplayer/test/unfold*.test.mjs'
      - 'server/unfold/**'
      - 'public/games/unfold/engine.mjs'
      - '.github/workflows/unfold-worker.yml'

permissions:
  contents: read

concurrency:
  group: unfold-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multiplayer/package-lock.json
      - run: npm ci
        working-directory: multiplayer
      - run: npm run check:unfold
        working-directory: multiplayer

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.UNFOLD_BACKEND == 'cloudflare'
    runs-on: ubuntu-latest
    environment: cloudflare-unfold
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multiplayer/package-lock.json
      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets. See multiplayer/UNFOLD.md.'
            exit 1
          fi
      - run: npm ci
        working-directory: multiplayer
      - run: npm run deploy:unfold
        working-directory: multiplayer
